const canvas=document.querySelector('#game'),g=canvas.getContext('2d'),status=document.querySelector('#status'),panel=document.querySelector('#panel'),heading=document.querySelector('#heading'),description=document.querySelector('#description'),levelButtons=document.querySelector('#levels'),action=document.querySelector('#action'),soundButton=document.querySelector('#sound'),hint=document.querySelector('#hint');
const width = canvas.width;
const height = canvas.height;
const main = document.querySelector('main');
const gameArea = document.querySelector('#gameArea');
const fullScreenButton = document.querySelector('#fullscreen');
const screenHelp = document.querySelector('#screenHelp');
const powerMeter = document.querySelector('#powerMeter');
const powerText = document.querySelector('#powerText');
const powerBar = document.querySelector('#powerBar');
const duelCue = document.querySelector('#duelCue');
const duelStones = 5;
let duelWon = false;
let duel = null;
const compactLandscape = matchMedia('(orientation: landscape) and (pointer: coarse), (orientation: landscape) and (max-height: 540px)');
const homeScreenApp = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isPhone = /iPhone|iPod/.test(navigator.userAgent);
const groundY = 462;
const origin = {x:107, y:403};
const maxPull = 170;
const throwSpeed = .145;
const gravity = .35;
const flightStepMs = 1000 / 60;
let nextFlightStep = 0;
let view = {left:0, top:0, width, height, scale:1};
const stages = [
  {name:"Shepherd's Training", ammo:5, t:[[579,402,24],[662,323,22],[748,229,21]], blocks:[]},
  {name:"The Hillside", ammo:6, t:[[530,413,23],[616,342,22],[715,268,21],[802,195,19]], blocks:[]},
  {name:"Stone and Timber", ammo:7, t:[[578,407,23],[684,326,22],[789,226,20]], blocks:[[410,416,40,46]]},
  {name:"The Narrow Pass", ammo:7, t:[[568,410,22],[665,330,21],[750,252,19],[830,164,18]], blocks:[[430,415,42,47],[535,350,40,28]]},
  {name:"The Shepherd's Trial", ammo:8, t:[[555,408,22],[636,363,21],[710,299,20],[780,228,19],[848,158,18]], blocks:[[375,419,38,43],[506,352,42,31]]},
];
let unlocked=1,stars=[0,0,0,0,0],muted=false,level=0,targets=[],blocks=[],ammo=0,shot=null,drag=null,mode='menu',particles=[],tick=0,ctx,shake=0,streak=[];
const progressKey = 'david-goliath-v04';
const progressCookie = 'david-goliath-progress=';
const progressPath = new URL('./', location.href).pathname;

function persist() {
  const data = JSON.stringify({unlocked, stars, ...(duelWon && {duelWon:true})});
  try { localStorage.setItem(progressKey, data); } catch {}
  // iOS copies cookies when adding a Home Screen app, while its local storage starts separately.
  const secure = location.protocol === 'https:' ? '; Secure' : '';

    document.cookie = progressCookie + encodeURIComponent(data) +
      '; Path=' + progressPath + '; Max-Age=31536000; SameSite=Lax' + secure;
  } catch {}
}

function restoreProgress() {
  let data;
  try { data = localStorage.getItem(progressKey); } catch {}
  try {
    if (!data) {
      const entry = document.cookie.split('; ').find(value => value.startsWith(progressCookie));
      if (!entry) return;
      data = decodeURIComponent(entry.slice(progressCookie.length));
    }
    const progress = JSON.parse(data);
    unlocked = Math.min(5, Math.max(1, Math.trunc(Number(progress.unlocked) || 1)));
    if (Array.isArray(progress.stars)) {
      stars = stars.map((_, i) => Math.min(3, Math.max(0, Math.trunc(Number(progress.stars[i]) || 0))));
    }
    duelWon = progress.duelWon === true;
    persist();
  } catch {}

restoreProgress();
function tone(f,d,type='triangle'){if(muted)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),v=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(60,f*.55),ctx.currentTime+d);v.gain.setValueAtTime(.1,ctx.currentTime);v.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(v);v.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
function update() {
  status.textContent = mode === 'play' ? '● ' + ammo + ' stones' : duel ? 'Duel' : 'Level ' + (level + 1);
}

function resetRound() {
  shot = null;
  drag = null;
  particles = [];
  streak = [];
  shake = 0;
  targets = [];
  blocks = [];
  duelCue.hidden = true;
  davidAnimation.reset();
}

function start(n) {
  resetRound();
  duel = null;
  level = n;
  const stage = stages[n];
  targets = stage.t.map(([x,y,r]) => ({x,y,r}));
  blocks = stage.blocks.map(([x,y,w,h]) => ({x,y,w,h}));
  ammo = stage.ammo;
  mode = 'play';
  panel.hidden = true;
  hint.textContent = 'LEVEL ' + (n + 1) + ' · ' + stage.name.toUpperCase() + ' — Drag back to aim, then release.';
  update();
}

function showPanel(title, text, button, next) {
  panel.hidden = false;
  heading.textContent = title;
  description.textContent = text;
  levelButtons.replaceChildren();
  action.textContent = button;
  action.onclick = next;
  update();
}

function menu() {
  resetRound();
  duel = null;
  mode = 'menu';
  const readyForDuel = stars.at(-1) > 0;
  showPanel('Choose a Level', 'Pick any training level or go straight to the Valley of Elah.',
    readyForDuel ? (duelWon ? 'Replay Goliath' : 'Face Goliath') : 'Play Level ' + unlocked,
    readyForDuel ? introduceDuel : () => start(unlocked - 1));
  stages.forEach((stage,i) => {
    const button = document.createElement('button');
    button.disabled = false;
    button.type = 'button';

    button.title = stage.name;
    button.onclick = () => start(i);
    levelButtons.appendChild(button);
  });
  const bossButton=document.createElement('button');
  bossButton.innerHTML='G<small>Goliath</small>';
  bossButton.title='Valley of Elah — Goliath';
  bossButton.type='button';
  bossButton.onclick=introduceDuel;
  levelButtons.appendChild(bossButton);
  hint.textContent = 'FIVE TRAINING LEVELS · GOLIATH BOSS';
}

function introduceDuel() {
  resetRound();
  const openedAt = performance.now();
  duel = {startedAt:openedAt, enemy:goliathDuel.pose(openedAt, openedAt), wonAt:null};
  mode = 'intro';
  hint.textContent = 'VALLEY OF ELAH';
  showPanel('Valley of Elah', 'The armies watch from opposite hills as Goliath calls for a challenger. David steps forward with his sling.',
    'Step Forward', startDuel);
}

function startDuel() {
  resetRound();
  const startedAt = performance.now();
  duel = {startedAt, enemy:goliathDuel.pose(startedAt, startedAt), wonAt:null};
  ammo = duelStones;
  mode = 'play';
  panel.hidden = true;
  hint.textContent = 'VALLEY OF ELAH — Time your throw to hit Goliath’s exposed forehead.';
  update();
}

function finish(won) {
  mode = won ? 'win' : 'lose';
  duelCue.hidden = true;
  if (duel) {
    if (won) {
      hint.textContent = 'VALLEY OF ELAH';
      showPanel('Goliath Falls!', 'David won the duel with one clean hit to the forehead.', 'Level Select', menu);
    } else {
      showPanel('Out of Stones', 'Wait for the shield to drop, then aim for his forehead.', 'Try Again', startDuel);
    }
    return;
  }
  if (won) {
    davidAnimation.celebrate(performance.now());
    const used = stages[level].ammo - ammo;
    const required = stages[level].t.length;
    const earned = used <= required ? 3 : used === required + 1 ? 2 : 1;
    const finalTraining = level === stages.length - 1;
    stars[level] = Math.max(stars[level], earned);
    unlocked = Math.max(unlocked, Math.min(stages.length, level + 2));
    persist();
    showPanel('Level Complete!', '★'.repeat(earned) + '☆'.repeat(3-earned) + ' · ' + used + ' stones used',
      finalTraining ? 'Face Goliath' : 'Next Level', finalTraining ? introduceDuel : () => start(level + 1));
    tone(630,.35);
  } else {
    showPanel('Out of Stones', 'Try another angle or more power.', 'Try Again', () => start(level));
  }
}

document.querySelector('#menu').onclick = menu;
document.querySelector('#retry').onclick = () => duel ? startDuel() : start(level);
soundButton.onclick = () => {
  muted = !muted;
  soundButton.textContent = muted ? 'Sound: Off' : 'Sound: On';
  if (!muted) tone(440,.12);
};
function resizeGame() {
  const rect = gameArea.getBoundingClientRect();
  const ratio = Math.min(window.devicePixelRatio || 1, 3);
  const pixelWidth = Math.round(rect.width * ratio);
  const pixelHeight = Math.round(rect.height * ratio);
  if (!pixelWidth || !pixelHeight) return;
  if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
    canvas.width = pixelWidth;
    canvas.height = pixelHeight;
    drag = null;
  }
  // Keep the tallest target and David's feet in view even with the browser toolbar open.
  const scale = Math.min(pixelWidth / width, pixelHeight / 370);
  const viewWidth = pixelWidth / scale;
  const viewHeight = pixelHeight / scale;
  view = {
    left:(width - viewWidth) / 2,
    top:(height - viewHeight) * (viewHeight < height ? .66 : .5),
    width:viewWidth, height:viewHeight, scale
  };
}

function syncDisplay() {
  main.classList.toggle('immersive', compactLandscape.matches || !!document.fullscreenElement);
  fullScreenButton.hidden = homeScreenApp || (!document.fullscreenEnabled && !isPhone);
  fullScreenButton.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
  resizeGame();
}

fullScreenButton.onclick = async () => {
  if (document.fullscreenElement) {
    await document.exitFullscreen();
    return;
  }
  if (document.fullscreenEnabled && document.documentElement.requestFullscreen) {
    try {
      await document.documentElement.requestFullscreen();
      return;
    } catch {
      if (!isPhone) return;
    }
  }
  if (isPhone) screenHelp.showModal();
};

compactLandscape.addEventListener('change', syncDisplay);
document.addEventListener('fullscreenchange', syncDisplay);
new ResizeObserver(resizeGame).observe(gameArea);
syncDisplay();

function pointer(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x:view.left + (e.clientX - rect.left) * view.width / rect.width,
    y:view.top + (e.clientY - rect.top) * view.height / rect.height
  };
}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0||mode!=='play'||shot||drag)return;const p=pointer(e);drag={a:p,b:p,id:e.pointerId};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id)drag.b=pointer(e)});

function aimFrom(start, end) {
  const dx = start.x - end.x;
  const dy = start.y - end.y;
  const distance = Math.hypot(dx, dy);
  const power = Math.min(maxPull, distance);
  const scale = distance > 0 ? power / distance * throwSpeed : 0;
  return {distance, power, vx:dx * scale, vy:dy * scale};

canvas.addEventListener('pointerup', e => {
  if (!drag || drag.id !== e.pointerId) return;
  const aim = aimFrom(drag.a, pointer(e));
  drag = null;
  if (aim.distance < 14) return;
  shot = {...origin, vx:aim.vx, vy:aim.vy, age:0};
  nextFlightStep = performance.now();
  ammo--;
  davidAnimation.release(nextFlightStep);
  streak = [];

function oval(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}
function line(x,y,X,Y,color,w){g.strokeStyle=color;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.stroke()}
const backgroundArt = new Image();
backgroundArt.src = 'assets/training-landscape-wide.svg';
const valleyArt = new Image();
valleyArt.src = 'assets/valley.svg';

function landscape() {
  const left = Math.min(0, view.left) - 6;
  const top = Math.min(0, view.top) - 6;
  const right = Math.max(width, view.left + view.width) + 6;
  const bottom = Math.max(height, view.top + view.height) + 6;
  const art = duel && valleyArt.naturalWidth ? valleyArt : backgroundArt;
  if (art.naturalWidth) {
    const zoom = duel ? 1.045 : 1;
    const drawWidth = (right - left) * zoom;
    const drawHeight = (bottom - top) * zoom;
    const centerX = (left + right) / 2;
    const groundAnchor = groundY;
    g.drawImage(art, centerX - drawWidth / 2, groundAnchor + (top - groundAnchor) * zoom, drawWidth, drawHeight);

    g.fillStyle = '#8bb7a2';
    g.fillRect(left, top, right - left, bottom - top);
  }

function advanceStone(stone) {

  stone.y += stone.vy;
  stone.vy += gravity;
}

function targetAt(stone) {
  return targets.findIndex(t => Math.hypot(stone.x - t.x, stone.y - t.y) < t.r + 7);
}

function hitsBlock(stone) {
  return blocks.some(b => stone.x + 6 > b.x && stone.x - 6 < b.x + b.w &&
    stone.y + 6 > b.y && stone.y - 6 < b.y + b.h);

  return stone.x < -30 || stone.x > width + 30 || stone.y > height + 30;
}

function preview() {
  powerMeter.hidden = !drag;
  if (!drag) return;
  const aim = aimFrom(drag.a, drag.b);
  const point = {...origin, vx:aim.vx, vy:aim.vy};

  for (let i = 0; aim.distance >= 14 && i < 110; i++) {
    const previous = {x:point.x, y:point.y};

    if (outOfBounds(point)) break;
    const impact = duel ? goliathDuel.impact(previous, point, duel.enemy) : targetAt(point) >= 0 || hitsBlock(point);

    if (impact) break;

  const power = Math.round(aim.power / maxPull * 100);
  if (powerBar.value !== power || !powerText.textContent) {

    powerText.textContent = 'POWER ' + power + '%';
  }

function impactParticles(x, y) {
  for (let i = 0; i < 12; i++) {
    particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:22});
  }
}

function hitDuel(impact, now, enemy) {
  impactParticles(impact.x, impact.y);
  shot = null;
  streak = [];
  shake = impact.kind === 'brow' ? 7 : 2;
  if (impact.kind === 'brow') {
    duel.wonAt = now;
    duel.enemy = enemy;
    duelWon = true;
    persist();
    mode = 'duel-fall';
    duelCue.hidden = true;
    davidAnimation.celebrate(now + 280);
    tone(545,.38);
    update();
  } else {
    if (impact.kind === 'shield') duel.blockedAt = now;
    tone(impact.kind === 'shield' ? 155 : 110,.15,'square');
  }

function advanceShot(now) {

  if (duel) {
    const enemy = goliathDuel.pose(now, duel.startedAt, duel.blockedAt);
    const impact = goliathDuel.impact(previous, shot, enemy);
    if (impact) {
      hitDuel(impact, now, enemy);
      return;
    }

  if (hit >= 0) {
    const target = targets.splice(hit, 1)[0];

    streak = [];

function drawShot(now) {

    nextFlightStep += flightStepMs;

function drawDuel(now) {
  if (!duel) return;

      duelCue.dataset.open = String(duel.enemy.open);

  if (mode === 'duel-fall' && now >= duel.wonAt + 970) finish(true);

function drawTraining() {
  for (const b of blocks) {
    g.fillStyle = '#85694e';
    g.fillRect(b.x,b.y,b.w,b.h);
    g.strokeStyle = '#5b4533';
    g.lineWidth = 3;
    g.strokeRect(b.x,b.y,b.w,b.h);
    line(b.x+4,b.y+5,b.x+b.w-4,b.y+b.h-5,'#b49b79',2);
  }
  for (const t of targets) {
    line(t.x,t.y,t.x,groundY,'#6e5134',7);
    oval(t.x,t.y,t.r+3,t.r+3,'#755138');
    oval(t.x,t.y,t.r,t.r,'#eee1bc');
    oval(t.x,t.y,t.r*.65,t.r*.65,'#bd6e4b');
    oval(t.x,t.y,t.r*.3,t.r*.3,'#f7e3b1');
    oval(t.x-t.r*.35,t.y-t.r*.35,3,3,'#ffffff66');
  }
}

function frame(now) {
  g.save();
  try {
    g.setTransform(view.scale,0,0,view.scale,-view.left*view.scale,-view.top*view.scale);
    tick++;
    if (shake > 0) {
      g.translate(Math.sin(tick*2.6)*shake,Math.cos(tick*2.1)*shake*.55);
      shake *= .78;
      if (shake < .3) shake = 0;
    }
    landscape();
    if (duel) drawDuel(now); else drawTraining();
    g.save();
    if (duel) {
      // Keep David's feet planted while giving Goliath more visual presence.
      g.translate(101, groundY);
      g.scale(.84, .84);
      g.translate(-101, -groundY);
    }
    davidAnimation.draw(g,performance.now(),drag);
    g.restore();
    preview();
    drawShot(now);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      oval(p.x,p.y,3,3,'#fff1b0');
      if (p.life <= 0) particles.splice(i,1);
    }
    if (mode === 'play' && !shot && ammo === 0) finish(false);
    if (mode === 'menu') {
      g.fillStyle = '#163a3599';
      g.fillRect(view.left-6,view.top-6,view.width+12,view.height+12);
    }
  } catch (e) {
    status.textContent = 'Game error';
    console.error(e);
  } finally {
    g.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
menu();
</script></body></html>
