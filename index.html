<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#193c36"><title>David & Goliath v0.5</title><style>*{box-sizing:border-box}body{margin:0;background:#17382f;color:white;font-family:system-ui;text-align:center}main{max-width:480px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:10px 8px}header strong{font-size:14px}button{background:#f1c67b;border:0;border-radius:11px;padding:10px 12px;font-weight:700;color:#3d3021}button:disabled{opacity:.35}canvas{width:100%;height:auto;display:block;touch-action:none}#gameArea{position:relative}#panel[hidden]{display:none!important}#hint{font-size:13px;color:#e9e3d0;padding:0 12px}#panel{position:absolute;z-index:3;top:42%;left:5%;width:90%;max-height:55%;overflow-y:auto;background:#234c3ff5;margin:0;padding:16px;border:2px solid #c8a36b;border-radius:16px;box-shadow:0 12px 30px #102a28a8}#panel h2{margin:4px 0 8px}#panel p{margin:7px 0}#levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}#levels button{padding:10px 2px;font-size:17px}small{display:block;font-size:10px}#action{margin:8px}#panel p{font-size:14px}</style></head><body><main><header><strong>DAVID & GOLIATH</strong><span id="status"></span><button id="menu">Levels</button><button id="retry">Retry</button></header><div id="gameArea"><canvas id="game" width="390" height="600"></canvas><p id="hint">Drag backward anywhere to aim. Release to throw.</p><section id="panel"><h2 id="heading"></h2><p id="description"></p><div id="levels"></div><button id="action"></button><button id="sound">Sound: On</button></section></div></main><script>
const canvas=document.querySelector('#game'),g=canvas.getContext('2d'),status=document.querySelector('#status'),panel=document.querySelector('#panel'),heading=document.querySelector('#heading'),description=document.querySelector('#description'),levelButtons=document.querySelector('#levels'),action=document.querySelector('#action'),soundButton=document.querySelector('#sound'),hint=document.querySelector('#hint');
const stages=[
{name:"Shepherd's Training",ammo:5,t:[[278,463,23],[320,367,20],[279,267,19]],blocks:[]},
{name:"The Hillside",ammo:6,t:[[290,465,22],[330,382,20],[285,295,19],[325,215,18]],blocks:[]},
{name:"Stone and Timber",ammo:7,t:[[300,460,22],[310,353,20],[320,245,19]],blocks:[[226,498,22,18]]},
{name:"The Narrow Pass",ammo:7,t:[[282,463,20],[330,360,19],[280,260,18],[328,173,17]],blocks:[[227,495,22,18],[246,404,22,17]]},
{name:"The Shepherd's Trial",ammo:8,t:[[280,464,20],[330,398,19],[285,327,18],[330,252,18],[280,182,17]],blocks:[[228,499,22,18],[248,385,20,17]]}
];const origin={x:90,y:465};let unlocked=1,stars=[0,0,0,0,0],muted=false,level=0,targets=[],blocks=[],ammo=0,shot=null,drag=null,mode='menu',particles=[],tick=0,ctx,shake=0,throwFlash=0,streak=[];
try{const p=JSON.parse(localStorage.getItem('david-goliath-v04')||'{}');unlocked=Math.min(5,Math.max(1,p.unlocked||1));if(Array.isArray(p.stars))stars=p.stars.slice(0,5).map(n=>Math.max(0,Math.min(3,n||0)))}catch(e){}
function persist(){try{localStorage.setItem('david-goliath-v04',JSON.stringify({unlocked,stars}))}catch(e){}}
function tone(f,d,type='triangle'){if(muted)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),v=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(60,f*.55),ctx.currentTime+d);v.gain.setValueAtTime(.1,ctx.currentTime);v.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(v);v.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
function update(){status.textContent=mode==='play'?'● '+ammo+' stones':'Level '+(level+1)}
function start(n){level=n;const s=stages[n];targets=s.t.map(a=>({x:a[0],y:a[1],r:a[2]}));blocks=s.blocks.map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]}));ammo=s.ammo;shot=null;drag=null;particles=[];streak=[];shake=0;throwFlash=0;mode='play';panel.hidden=true;if(hint)hint.textContent='LEVEL '+(n+1)+' · '+s.name.toUpperCase()+' — Drag backward to aim.';update()}
function menu(){mode='menu';shot=null;drag=null;panel.hidden=false;heading.textContent='Choose a Level';description.textContent='Earn stars by using fewer stones. Progress saves on this device.';levelButtons.innerHTML='';stages.forEach((s,i)=>{const b=document.createElement('button');b.disabled=i>=unlocked;b.innerHTML=(i+1)+'<small>'+(stars[i]?'★'.repeat(stars[i]):'☆')+'</small>';b.title=s.name;b.onclick=()=>start(i);levelButtons.appendChild(b)});action.textContent='Play Level '+Math.min(unlocked,5);action.onclick=()=>start(Math.min(unlocked,5)-1);if(hint)hint.textContent='SHEPHERD’S TRAINING · FIVE LEVELS';update()}
function finish(won){mode=won?'win':'lose';panel.hidden=false;levelButtons.innerHTML='';if(won){const used=stages[level].ammo-ammo,required=stages[level].t.length,earned=used<=required?3:used===required+1?2:1;stars[level]=Math.max(stars[level],earned);unlocked=Math.max(unlocked,Math.min(5,level+2));persist();heading.textContent='Level Complete!';description.textContent='★'.repeat(earned)+'☆'.repeat(3-earned)+' · '+used+' stones used';action.textContent=level<4?'Next Level':'Level Select';action.onclick=()=>level<4?start(level+1):menu();tone(630,.35)}else{heading.textContent='Out of Stones';description.textContent='Try another angle or more power.';action.textContent='Try Again';action.onclick=()=>start(level)}update()}
document.querySelector('#menu').onclick=menu;document.querySelector('#retry').onclick=()=>start(level);soundButton.onclick=()=>{muted=!muted;soundButton.textContent=muted?'Sound: Off':'Sound: On';if(!muted)tone(440,.12)};
function pointer(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*390/r.width,y:(e.clientY-r.top)*600/r.height}}
canvas.addEventListener('pointerdown',e=>{if(mode!=='play'||shot||drag)return;const p=pointer(e);drag={a:p,b:p,id:e.pointerId};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id)drag.b=pointer(e)});
canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const p=pointer(e),dx=drag.a.x-p.x,dy=drag.a.y-p.y,d=Math.hypot(dx,dy);drag=null;if(d<14)return;const k=Math.min(170,d)/d;shot={x:origin.x,y:origin.y,vx:dx*k*.115,vy:dy*k*.115,age:0};ammo--;throwFlash=14;streak=[];tone(380,.16);update()});
function oval(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}
function line(x,y,X,Y,color,w){g.strokeStyle=color;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.stroke()}
function landscape(){const sky=g.createLinearGradient(0,0,0,600);sky.addColorStop(0,'#78bbd8');sky.addColorStop(.75,'#f9e4ae');sky.addColorStop(1,'#d8b784');g.fillStyle=sky;g.fillRect(0,0,390,600);oval(320,100,34,34,'#ffe5a0');for(let i=0;i<4;i++)oval(40+i*112,145+i%2*23,55,11,'#ffffff66');g.fillStyle='#b5c9a4';g.beginPath();g.moveTo(0,375);g.quadraticCurveTo(125,260,240,363);g.quadraticCurveTo(320,292,390,349);g.lineTo(390,600);g.lineTo(0,600);g.fill();g.fillStyle='#80a982';g.beginPath();g.moveTo(0,451);g.quadraticCurveTo(150,335,270,430);g.quadraticCurveTo(350,370,390,415);g.lineTo(390,600);g.lineTo(0,600);g.fill();g.fillStyle='#d5b67d';g.beginPath();g.moveTo(0,524);g.quadraticCurveTo(180,499,390,519);g.lineTo(390,600);g.lineTo(0,600);g.fill();for(let i=0;i<18;i++){let x=(i*71+15)%390,y=527+(i*31)%70;line(x,y,x-2,y-7,'#a6a16b',2)}}
function david(){const sway=Math.sin(tick*.05)*1.1;oval(83,524,28,7,'#7b6c48aa');line(76,493,73,520,'#6b4932',9);line(92,493,95,520,'#6b4932',9);line(70,521,78,521,'#4c3527',5);line(92,521,102,521,'#4c3527',5);g.fillStyle='#f2e3bb';g.beginPath();g.moveTo(76,457);g.lineTo(96,457);g.lineTo(105,498);g.lineTo(65,498);g.closePath();g.fill();line(73,478,100,478,'#98633e',5);oval(100,483,7,9,'#805735');line(77,462,66,485,'#d8a478',7);line(97,461,106,476,'#d8a478',7);oval(86,439+sway,14,16,'#dba476');g.fillStyle='#473124';g.beginPath();g.arc(86,434+sway,15,Math.PI,Math.PI*2);g.lineTo(101,439);g.quadraticCurveTo(84,429,72,444);g.fill();oval(91,441+sway,1.5,1.5,'#2e2925');line(91,449+sway,96,448+sway,'#8a5642',1.5);const angle=drag?Math.atan2(drag.a.y-drag.b.y,drag.a.x-drag.b.x):tick*.11,sx=106+Math.cos(angle)*14,sy=476+Math.sin(angle)*14;line(106,476,sx,sy,'#6a4934',2);oval(sx,sy,4,3,'#72543b');line(sx,sy,106,476,'#c4a176',1)}
function preview(){if(!drag)return;const dx=drag.a.x-drag.b.x,dy=drag.a.y-drag.b.y,d=Math.hypot(dx,dy)||1,k=Math.min(170,d)/d;let vx=dx*k*.115,vy=dy*k*.115,x=origin.x,y=origin.y;line(drag.a.x,drag.a.y,drag.b.x,drag.b.y,'#ffffffaa',2);for(let i=0;i<60;i++){x+=vx;y+=vy;vy+=.35;if(i%2===0)oval(x,y,2,2,'#ffffffc9');if(y>600)break}const power=Math.min(100,Math.round(d/170*100));g.fillStyle='#153d36aa';g.fillRect(16,35,116,26);g.fillStyle='#f3d18d';g.fillRect(22,53,power,5);g.fillStyle='white';g.font='12px system-ui';g.fillText('POWER '+power+'%',22,48)}
function frame(){try{tick++;g.save();if(shake>0){g.translate(Math.sin(tick*2.6)*shake,Math.cos(tick*2.1)*shake*.55);shake*=.78;if(shake<.3)shake=0}landscape();for(const b of blocks){g.fillStyle='#85694e';g.fillRect(b.x,b.y,b.w,b.h);g.strokeStyle='#5b4533';g.lineWidth=3;g.strokeRect(b.x,b.y,b.w,b.h);line(b.x+4,b.y+5,b.x+b.w-4,b.y+b.h-5,'#b49b79',2)}for(const t of targets){line(t.x,t.y,t.x,520,'#6e5134',7);oval(t.x,t.y,t.r+3,t.r+3,'#755138');oval(t.x,t.y,t.r,t.r,'#eee1bc');oval(t.x,t.y,t.r*.65,t.r*.65,'#bd6e4b');oval(t.x,t.y,t.r*.3,t.r*.3,'#f7e3b1')}david();if(throwFlash>0){throwFlash--;oval(112,473,2+throwFlash*.3,2+throwFlash*.3,'#f6e7bb88')}preview();
if(shot){shot.x+=shot.vx;shot.y+=shot.vy;shot.vy+=.35;shot.age++;streak.push({x:shot.x,y:shot.y});if(streak.length>9)streak.shift();streak.forEach((p,i)=>oval(p.x,p.y,Math.max(1,i*.45),Math.max(1,i*.45),'#e7dcc488'));oval(shot.x,shot.y,7,7,'#514d43');const hit=targets.findIndex(t=>Math.hypot(shot.x-t.x,shot.y-t.y)<t.r+7);if(hit>=0){const t=targets.splice(hit,1)[0];for(let i=0;i<12;i++)particles.push({x:t.x,y:t.y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:22});shot=null;streak=[];shake=5;tone(180,.22,'square');if(!targets.length)finish(true)}else if(blocks.some(b=>shot.x+6>b.x&&shot.x-6<b.x+b.w&&shot.y+6>b.y&&shot.y-6<b.y+b.h)){shot=null;streak=[];shake=3;tone(120,.12,'square')}else if(shot.x>420||shot.x< -30||shot.y>630||shot.age>280){shot=null;streak=[]}}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;oval(p.x,p.y,3,3,'#fff1b0');if(p.life<=0)particles.splice(i,1)}if(mode==='play'&&!shot&&ammo===0)finish(false);if(mode==='menu'){g.fillStyle='#163a3599';g.fillRect(0,0,390,600);g.textAlign='center';g.fillStyle='white';g.font='bold 28px system-ui';g.fillText('DAVID & GOLIATH',195,208);g.font='17px system-ui';g.fillText('A shepherd’s journey begins',195,246);g.textAlign='left'}g.restore()}catch(e){status.textContent='Game error';console.error(e)}requestAnimationFrame(frame)}
requestAnimationFrame(frame);menu();
</script></body></html>
