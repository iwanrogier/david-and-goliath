<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>David & Goliath</title><style>*{box-sizing:border-box}body{margin:0;background:#233d35;color:#fff;font:16px system-ui;text-align:center}main{max-width:480px;margin:auto}header{display:flex;align-items:center;justify-content:space-around;gap:8px;padding:12px}button{border:0;border-radius:10px;background:#f4c879;padding:10px 16px;font-weight:700}canvas{display:block;width:100%;height:auto;touch-action:none}p{font-size:14px;padding:0 15px}</style></head><body><main><header><strong>David & Goliath</strong><span id="status">Stones: 5</span><button id="restart">Restart</button></header><canvas id="game" width="390" height="600"></canvas><p>Touch anywhere, drag down and left to aim, then release. Longer drags make stronger shots.</p></main><script>
const c=document.getElementById('game'),g=c.getContext('2d'),status=document.getElementById('status');const O={x:75,y:470};let targets,shot,drag,stones,message;
function reset(){targets=[{x:285,y:460},{x:320,y:350},{x:275,y:250}];shot=null;drag=null;stones=5;message='';update()}function update(){status.textContent=message||'Stones: '+stones}reset();document.getElementById('restart').onclick=reset;
function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*390/r.width,y:(e.clientY-r.top)*600/r.height}}
c.addEventListener('pointerdown',e=>{if(shot||stones<=0||targets.length===0)return;drag={start:point(e),now:point(e),id:e.pointerId};c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId)drag.now=point(e)});
c.addEventListener('pointercancel',()=>{drag=null});
c.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const end=point(e),dx=drag.start.x-end.x,dy=drag.start.y-end.y;drag=null;const d=Math.hypot(dx,dy);if(d<12)return;const scale=Math.min(d,160)/d;shot={x:O.x,y:O.y,vx:dx*scale*.115,vy:dy*scale*.115,life:0};stones--;update()});
function frame(){const sky=g.createLinearGradient(0,0,0,600);sky.addColorStop(0,'#a3d6e8');sky.addColorStop(1,'#f8dfab');g.fillStyle=sky;g.fillRect(0,0,390,600);g.fillStyle='#91b77f';g.beginPath();g.moveTo(0,390);g.quadraticCurveTo(120,280,220,390);g.quadraticCurveTo(310,300,390,375);g.lineTo(390,600);g.lineTo(0,600);g.fill();g.fillStyle='#c8b07a';g.fillRect(0,500,390,100);
g.fillStyle='#edcf98';g.beginPath();g.arc(75,445,13,0,Math.PI*2);g.fill();g.fillStyle='#eee9cf';g.fillRect(63,459,24,43);g.fillStyle='#77513b';g.fillRect(65,501,7,20);g.fillRect(80,501,7,20);
g.strokeStyle='#694323';g.lineWidth=4;g.beginPath();g.moveTo(O.x,O.y);g.lineTo(85,465);g.stroke();
if(drag){const dx=drag.start.x-drag.now.x,dy=drag.start.y-drag.now.y,d=Math.hypot(dx,dy)||1,k=Math.min(d,160)/d;let vx=dx*k*.115,vy=dy*k*.115,px=O.x,py=O.y;g.strokeStyle='#ffffffbb';g.lineWidth=2;g.beginPath();g.moveTo(drag.start.x,drag.start.y);g.lineTo(drag.now.x,drag.now.y);g.stroke();g.fillStyle='#fff';for(let i=0;i<30;i++){px+=vx*1.5;py+=vy*1.5;vy+=.525;g.beginPath();g.arc(px,py,2,0,Math.PI*2);g.fill()}}
for(const b of targets){g.fillStyle='#674527';g.fillRect(b.x-3,b.y,6,500-b.y);g.fillStyle='#f0dcb3';g.beginPath();g.arc(b.x,b.y,22,0,Math.PI*2);g.fill();g.strokeStyle='#a64d3b';g.lineWidth=5;g.stroke();g.beginPath();g.arc(b.x,b.y,8,0,Math.PI*2);g.stroke()}
if(shot){shot.x+=shot.vx;shot.y+=shot.vy;shot.vy+=.35;shot.life++;g.fillStyle='#444';g.beginPath();g.arc(shot.x,shot.y,7,0,Math.PI*2);g.fill();const hitIndex=targets.findIndex(b=>Math.hypot(shot.x-b.x,shot.y-b.y)<28);if(hitIndex>=0){targets.splice(hitIndex,1);shot=null;if(targets.length===0){message='Victory!';update()}}else if(shot.y>620||shot.x>420||shot.x< -30||shot.life>250){shot=null}}
if(!shot&&stones===0&&targets.length>0&&message!=='Out of stones'){message='Out of stones';update()}if(message){g.fillStyle='#173a34d9';g.fillRect(40,180,310,130);g.textAlign='center';g.fillStyle='#fff';g.font='bold 26px system-ui';g.fillText(message,195,235);g.font='15px system-ui';g.fillText('Tap Restart to play again',195,275);g.textAlign='left'}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
