<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>David & Goliath</title><style>body{margin:0;background:#243e37;color:white;font:16px system-ui;text-align:center}canvas{width:min(100vw,420px);touch-action:none;background:linear-gradient(#a5d9eb 60%,#b8ad76 60%);border-radius:12px}button{padding:12px;margin:10px}</style><h2>David & Goliath</h2><p id="status">Stones: 5</p><canvas width="390" height="600"></canvas><p>Drag back from David and release to fire!</p><button onclick="reset()">Restart</button><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),S=document.querySelector('#status');let balls,shot,drag,left;function reset(){balls=[{x:285,y:460},{x:320,y:350},{x:275,y:250}];shot=null;drag=null;left=5;S.textContent='Stones: 5'}reset();function xy(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*390/r.width,y:(e.clientY-r.top)*600/r.height}}c.onpointerdown=e=>{if(!shot&&left>0){drag=xy(e);c.setPointerCapture(e.pointerId)}};c.onpointermove=e=>{if(drag)drag=xy(e)};c.onpointerup=e=>{if(!drag)return;let p=xy(e);shot={x:75,y:470,vx:(75-p.x)*.14,vy:(470-p.y)*.14};drag=null;left--;S.textContent='Stones: '+left};function frame(){g.clearRect(0,0,390,600);g.fillStyle='#6b9b72';g.fillRect(0,500,390,100);g.fillStyle='#edcf98';g.beginPath();g.arc(75,445,13,0,7);g.fill();g.fillStyle='#eee9cf';g.fillRect(63,459,24,43);g.fillStyle='#77513b';g.fillRect(65,501,7,20);g.fillRect(80,501,7,20);g.strokeStyle='#694323';g.lineWidth=4;g.beginPath();g.moveTo(75,470);g.lineTo(drag?drag.x:85,drag?drag.y:465);g.stroke();for(let b of balls){g.fillStyle='#674527';g.fillRect(b.x-3,b.y,6,500-b.y);g.fillStyle='#f0dcb3';g.beginPath();g.arc(b.x,b.y,22,0,7);g.fill();g.strokeStyle='#a64d3b';g.lineWidth=5;g.stroke();g.beginPath();g.arc(b.x,b.y,8,0,7);g.stroke()}if(shot){shot.x+=shot.vx;shot.y+=shot.vy;shot.vy+=.35;g.fillStyle='#444';g.beginPath();g.arc(shot.x,shot.y,7,0,7);g.fill();balls=balls.filter(b=>{if(Math.hypot(shot.x-b.x,shot.y-b.y)<27){shot=null;return false}return true});if(shot&&(shot.y>620||shot.x>410||shot.x<0))shot=null}if(!balls.length)S.textContent='Victory!';else if(!shot&&left===0)S.textContent='Out of stones — restart!';requestAnimationFrame(frame)}frame()</script></html>
