<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#193c36"><title>David & Goliath — Shepherd's Training</title><style>*{box-sizing:border-box}body{margin:0;background:#17382f;color:#fff;font-family:system-ui;text-align:center}main{max-width:480px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;padding:12px;gap:8px}header strong{font-size:15px}button{background:#f1c67b;color:#3e3021;border:0;border-radius:12px;padding:10px 14px;font-weight:700}canvas{display:block;width:100%;height:auto;touch-action:none}p{font-size:13px;padding:0 12px;color:#e8e3cf}</style></head><body><main><header><strong>DAVID & GOLIATH</strong><span id="status">5 stones</span><button id="restart">Restart</button></header><canvas id="game" width="390" height="640"></canvas><p>LEVEL 1 · SHEPHERD'S TRAINING<br>Touch anywhere, drag down-left to aim, release to throw.</p></main><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),status=document.querySelector('#status'),O={x:90,y:465};let targets,stone,drag,stones,phase,fx=[],time=0,audio=null;
function sound(freq,dur,type='sine'){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(70,freq*.45),audio.currentTime+dur);v.gain.setValueAtTime(.12,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function reset(){targets=[{x:280,y:465,r:23},{x:321,y:373,r:20},{x:280,y:280,r:18}];stone=null;drag=null;stones=5;phase='play';fx=[];update()}function update(){status.textContent=phase==='win'?'Victory!':phase==='lose'?'Try again':'● '+stones+' stones'}reset();document.querySelector('#restart').onclick=reset;
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*390/r.width,y:(e.clientY-r.top)*640/r.height}}
c.addEventListener('pointerdown',e=>{if(phase!=='play'||stone||drag)return;const p=pos(e);drag={start:p,now:p,id:e.pointerId};c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId)drag.now=pos(e)});
c.addEventListener('pointercancel',()=>drag=null);
c.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const p=pos(e),dx=drag.start.x-p.x,dy=drag.start.y-p.y,d=Math.hypot(dx,dy);drag=null;if(d<15)return;const k=Math.min(170,d)/d;stone={x:O.x,y:O.y,vx:dx*k*.115,vy:dy*k*.115,life:0};stones--;sound(350,.16,'triangle');update()});
function ellipse(x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}
function line(x,y,x2,y2,col,w){g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke()}
function scene(){let sky=g.createLinearGradient(0,0,0,640);sky.addColorStop(0,'#7bbfda');sky.addColorStop(.68,'#f7e4b4');sky.addColorStop(1,'#e9c98c');g.fillStyle=sky;g.fillRect(0,0,390,640);ellipse(319,105,34,34,'#ffe8a1');for(let i=0;i<4;i++)ellipse(50+i*110,135+(i%2)*24,60,12,'#ffffff65');g.fillStyle='#b1c7a1';g.beginPath();g.moveTo(0,370);g.quadraticCurveTo(110,260,225,363);g.quadraticCurveTo(305,288,390,346);g.lineTo(390,640);g.lineTo(0,640);g.fill();g.fillStyle='#7fae80';g.beginPath();g.moveTo(0,450);g.quadraticCurveTo(130,330,270,435);g.quadraticCurveTo(345,376,390,407);g.lineTo(390,640);g.lineTo(0,640);g.fill();g.fillStyle='#d6b980';g.beginPath();g.moveTo(0,528);g.quadraticCurveTo(180,502,390,520);g.lineTo(390,640);g.lineTo(0,640);g.fill();for(let i=0;i<18;i++){let x=(i*71+15)%390,y=535+(i*31)%100;line(x,y,x-2,y-7,'#9b9c61',2)}}
function david(){const sway=Math.sin(time*.05)*1.2;ellipse(83,524,28,7,'#7b6c48aa');line(76,493,73,520,'#6b4932',9);line(92,493,95,520,'#6b4932',9);line(70,521,78,521,'#4c3527',5);line(92,521,102,521,'#4c3527',5);g.fillStyle='#f2e3bb';g.beginPath();g.moveTo(76,457);g.lineTo(96,457);g.lineTo(105,498);g.lineTo(65,498);g.closePath();g.fill();line(73,478,100,478,'#98633e',5);ellipse(100,483,7,9,'#805735');line(77,462,66,485,'#d8a478',7);line(97,461,106,476,'#d8a478',7);ellipse(86,439+sway,14,16,'#dba476');g.fillStyle='#473124';g.beginPath();g.arc(86,434+sway,15,Math.PI,Math.PI*2);g.lineTo(101,439);g.quadraticCurveTo(84,429,72,444);g.fill();ellipse(91,441+sway,1.5,1.5,'#2e2925');line(91,449+sway,96,448+sway,'#8a5642',1.5);
let ang=drag?Math.atan2(drag.start.y-drag.now.y,drag.start.x-drag.now.x):time*.11;let rad=drag?16:14;let sx=106+Math.cos(ang)*rad,sy=476+Math.sin(ang)*rad;line(106,476,sx,sy,'#6a4934',2);ellipse(sx,sy,4,3,'#72543b');line(sx,sy,106,476,'#c4a176',1)}
function aim(){if(!drag)return;let dx=drag.start.x-drag.now.x,dy=drag.start.y-drag.now.y,d=Math.hypot(dx,dy)||1,k=Math.min(170,d)/d,vx=dx*k*.115,vy=dy*k*.115,px=O.x,py=O.y;line(drag.start.x,drag.start.y,drag.now.x,drag.now.y,'#ffffffbb',2);for(let i=0;i<38;i++){px+=vx*1.25;py+=vy*1.25;vy+=.4375;ellipse(px,py,2,2,'#ffffffc9')}}
function draw(){time++;scene();for(let t of targets){line(t.x,t.y,t.x,522,'#6e5134',7);ellipse(t.x,t.y,t.r+3,t.r+3,'#755138');ellipse(t.x,t.y,t.r,t.r,'#eee1bc');ellipse(t.x,t.y,t.r*.65,t.r*.65,'#bd6e4b');ellipse(t.x,t.y,t.r*.3,t.r*.3,'#f7e3b1')}david();aim();
if(stone){stone.x+=stone.vx;stone.y+=stone.vy;stone.vy+=.35;stone.life++;ellipse(stone.x,stone.y,7,7,'#514d43');let hit=targets.findIndex(t=>Math.hypot(stone.x-t.x,stone.y-t.y)<t.r+7);if(hit>=0){let t=targets.splice(hit,1)[0];for(let i=0;i<12;i++)fx.push({x:t.x,y:t.y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:22});stone=null;sound(160,.25,'square');if(!targets.length){phase='win';sound(620,.35,'triangle');update()}}else if(stone.x>430||stone.x< -25||stone.y>660||stone.life>260)stone=null}
for(let i=fx.length-1;i>=0;i--){let p=fx[i];p.x+=p.vx;p.y+=p.vy;p.life--;ellipse(p.x,p.y,3,3,'#fff1b0');if(p.life<=0)fx.splice(i,1)}if(!stone&&stones===0&&phase==='play'){phase='lose';update()}if(phase!=='play'){g.fillStyle='#163a35dc';g.fillRect(36,193,318,159);g.textAlign='center';g.fillStyle='#fff';g.font='bold 28px system-ui';g.fillText(phase==='win'?'LEVEL COMPLETE!':'OUT OF STONES',195,254);g.font='17px system-ui';g.fillText(phase==='win'?'★★★':'Keep practicing!',195,290);g.font='14px system-ui';g.fillText('Tap Restart to play again',195,323);g.textAlign='left'}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
